name: Guardrails

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Lint is informational while the codebase is still being cleaned.
    # Failures show up in the CI logs but do not block merge. The format
    # check below IS strict.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint with ruff
        run: ruff check .

  format-check:
    name: Format (ruff format)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version

      - name: Install ruff
        run: python -m pip install ruff

      - name: Check formatting
        run: ruff format --check .

  pure-math-tests:
    name: Pure-math tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install test dependencies
        run: uv sync --group test

      - name: Use uv virtual environment
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check tracked file sizes
        run: python scripts/check_tracked_file_size.py

      - name: Run dissipation guardrail tests
        run: >
          PYTHONPATH=src python -m pytest --tb=short -q
          tests/test_sbp_dissipation.py
          tests/test_sbp_generator.py
          tests/test_mesh_dissipation.py
          tests/test_assembly_dissipation.py
          tests/test_runtime_dissipation.py
          -v

      - name: Run broader non-PETSc tests
        # Advisory: chain inventory after mesh/filters.py deferral —
        # ``from linstabpy.operators import build_lnse_operator`` still
        # pulls petsc4py because ``operators/assembly.py`` imports
        # ``_matrix_nnz`` from ``utils/petsc_core`` at module top, and
        # ``petsc_core`` runs ``init_petsc_from_argv()`` at module load.
        # Same pattern in solvers/linsolve.py, results_runtime.py, and
        # 7 modules under linear_operators/. Each needs the same
        # defer-into-function refactor that mesh/filters.py received.
        # Flip back to strict (drop continue-on-error) when the eager
        # PETSc init at module-top is gone from all remaining files.
        continue-on-error: true
        run: >
          PYTHONPATH=src python -m pytest --tb=short -q tests/
          -m "not slow"
          --ignore=tests/test_linear_operator_adapters.py
          --ignore=tests/test_linear_operator_matrix.py
          --ignore=tests/test_linear_operator_product.py
          --ignore=tests/test_linear_operator_projection.py
          --ignore=tests/test_linear_operator_shell.py
          --ignore=tests/test_solvers.py
          --ignore=tests/test_solvers_inexact.py

  petsc-tests:
    name: PETSc-backed tests (Docker)
    runs-on: ubuntu-latest
    # Advisory while the Dockerfile PETSc configure is debugged. PETSc
    # configure currently fails at ~12s inside the container with
    # "UNABLE to CONFIGURE with GIVEN OPTIONS / RuntimeError: 256",
    # which is a Dockerfile/build-environment issue independent of the
    # rest of the suite. Promote to a hard gate once a local
    # `docker build .` from a clean clone succeeds.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0

      - name: Build PETSc-backed image
        uses: docker/build-push-action@1a162644f9a7e87d8f4b053101d1d9a712edc18c # v6.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: linstabpy-petsc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run PETSc-required tests
        run: |
          docker run --rm linstabpy-petsc:ci \
            sh -c "PYTHONPATH=src pytest --tb=short -q \
              tests/test_linear_operator_adapters.py \
              tests/test_linear_operator_matrix.py \
              tests/test_linear_operator_product.py \
              tests/test_linear_operator_projection.py \
              tests/test_linear_operator_shell.py \
              tests/test_solvers.py \
              tests/test_solvers_inexact.py \
              -v"
