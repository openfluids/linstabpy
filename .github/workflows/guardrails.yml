name: Guardrails

on:
  push:
  pull_request:
    branches:
      - main

# Read-only token: nothing here pushes, comments or publishes.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint with ruff
        run: ruff check .

  format-check:
    name: Format (ruff format)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install ruff
        run: python -m pip install ruff

      - name: Check formatting
        run: ruff format --check .

  generated-refs:
    name: Generated agent refs in sync
    runs-on: ubuntu-latest
    # Both generators are stdlib-only: no venv, no PETSc, no uv sync.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Check wiki boundaries are current
        run: python3 tools/generate_wiki_boundaries.py --check

      - name: Check llms-full.txt is current
        run: python3 tools/generate_llms_full.py --check

      - name: Check skill generated refs are current
        run: python3 skills/linstabpy/scripts/generate_skill_refs.py --check

  pure-math-tests:
    name: Pure-math tests
    # One leg only: Linux on the current Python. This repo is private, where
    # GitHub bills macOS at 10x Linux, and a version matrix multiplies that
    # again. These are pure-math tests with no platform-specific code paths.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install test dependencies
        run: uv sync --group test

      - name: Use uv virtual environment
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check tracked file sizes
        run: python -m pytest tests/test_tracked_file_size.py -q --tb=line

      - name: Run dissipation guardrail tests
        run: >
          PYTHONPATH=src python -m pytest --tb=short -q
          tests/test_sbp_dissipation.py
          tests/test_sbp_generator.py
          tests/test_mesh_dissipation.py
          tests/test_assembly_dissipation.py
          tests/test_runtime_dissipation.py
          -v

      - name: Run broader non-PETSc tests
        run: >
          PYTHONPATH=src python -m pytest --tb=short -q tests/
          -m "not slow"
          --ignore=tests/test_solvers.py
          --ignore=tests/test_solvers_inexact.py

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Build
        run: uv build --out-dir dist

      # The source archive carries the package, its tests and the legal
      # files only. Examples, logs, docs and the wiki stay in the repository.
      - name: Check the sdist holds no examples, docs or wiki
        run: |
          if tar tzf dist/*.tar.gz | grep -E '^[^/]+/(examples|wiki|skills|graft|docs|paper)/'; then
            echo "sdist contains repository-only folders" >&2
            exit 1
          fi

      - name: Install the wheel and import it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install dist/*.whl
          /tmp/wheel-venv/bin/python -c "import linstabpy; print(linstabpy.__version__)"

