name: Guardrails

on:
  push:
  pull_request:
    branches:
      - main

# Read-only token: nothing here pushes, comments or publishes.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Lint is informational while the codebase is still being cleaned.
    # Failures show up in the CI logs but do not block merge. The format
    # check below IS strict.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint with ruff
        run: ruff check .

  format-check:
    name: Format (ruff format)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install ruff
        run: python -m pip install ruff

      - name: Check formatting
        run: ruff format --check .

  pure-math-tests:
    name: Pure-math tests
    # One leg only: Linux on the current Python. This repo is private, where
    # GitHub bills macOS at 10x Linux, and a version matrix multiplies that
    # again. These are pure-math tests with no platform-specific code paths.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install test dependencies
        run: uv sync --group test

      - name: Use uv virtual environment
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check tracked file sizes
        run: python scripts/check_tracked_file_size.py

      - name: Run dissipation guardrail tests
        run: >
          PYTHONPATH=src python -m pytest --tb=short -q
          tests/test_sbp_dissipation.py
          tests/test_sbp_generator.py
          tests/test_mesh_dissipation.py
          tests/test_assembly_dissipation.py
          tests/test_runtime_dissipation.py
          -v

      - name: Run broader non-PETSc tests
        # Advisory while the long tail of eager-PETSc-init files is
        # refactored one at a time. Progress so far:
        #   mesh/filters.py        — defer pattern applied (commit 50c3cde)
        #   utils/petsc_core.py    — PEP 562 + duck-type (commit b657f08)
        # Remaining:
        #   solvers/eigenvalue.py, solvers/resolvent.py, solvers/spatial_eig.py,
        #   solvers/linsolve.py, results_runtime.py, and 7 modules under
        #   linear_operators/.
        # Tests like test_analytical.py legitimately use
        # ``temporal_eigenvalues`` (a SLEPc-only function) and belong on
        # the Docker petsc-tests path; the broader-tests strict gate will
        # work once those tests are either refactored to a pure-math
        # smoke variant or moved into the PETSc-required ``--ignore``
        # list.
        continue-on-error: true
        run: >
          PYTHONPATH=src python -m pytest --tb=short -q tests/
          -m "not slow"
          --ignore=tests/test_linear_operator_adapters.py
          --ignore=tests/test_linear_operator_matrix.py
          --ignore=tests/test_linear_operator_product.py
          --ignore=tests/test_linear_operator_projection.py
          --ignore=tests/test_linear_operator_shell.py
          --ignore=tests/test_solvers.py
          --ignore=tests/test_solvers_inexact.py

  petsc-tests:
    name: PETSc-backed tests (Docker)
    runs-on: ubuntu-latest
    # Advisory while the Dockerfile PETSc configure is debugged. PETSc
    # configure currently fails at ~12s inside the container with
    # "UNABLE to CONFIGURE with GIVEN OPTIONS / RuntimeError: 256",
    # which is a Dockerfile/build-environment issue independent of the
    # rest of the suite. Promote to a hard gate once a local
    # `docker build .` from a clean clone succeeds.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build PETSc-backed image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: linstabpy-petsc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run PETSc-required tests
        run: |
          docker run --rm linstabpy-petsc:ci \
            sh -c "PYTHONPATH=src pytest --tb=short -q \
              tests/test_linear_operator_adapters.py \
              tests/test_linear_operator_matrix.py \
              tests/test_linear_operator_product.py \
              tests/test_linear_operator_projection.py \
              tests/test_linear_operator_shell.py \
              tests/test_solvers.py \
              tests/test_solvers_inexact.py \
              -v"
