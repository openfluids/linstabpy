name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/pages/**"
      - "docs/mkdocs.yml"
      - "docs/scripts/generate_llms_full.py"
      - "docs/scripts/generate_wiki_boundaries.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/pages/**"
      - "docs/mkdocs.yml"
      - "docs/scripts/generate_llms_full.py"
      - "docs/scripts/generate_wiki_boundaries.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# The site is served by Vercel (https://linstabpy.vercel.app/). This workflow
# only checks that the wiki builds with zero warnings.
permissions:
  contents: read

jobs:
  build:
    name: Build wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      # --only-group skips the numerical stack. MkDocs does not need it.
      - run: uv sync --only-group wiki
      - run: python3 docs/scripts/generate_wiki_boundaries.py
      - run: python3 docs/scripts/generate_llms_full.py
      - run: uv run --only-group wiki mkdocs build --strict -f docs/mkdocs.yml
