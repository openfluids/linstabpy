name: Docs

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "mkdocs.yml"
      - "tools/generate_llms_full.py"
      - "tools/generate_wiki_boundaries.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "wiki/**"
      - "mkdocs.yml"
      - "tools/generate_llms_full.py"
      - "tools/generate_wiki_boundaries.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# The site is served by Vercel (https://linstabpy.vercel.app/). This workflow
# only checks that the wiki builds with zero warnings.
permissions:
  contents: read

jobs:
  build:
    name: Build wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      # --only-group skips the numerical stack. MkDocs does not need it.
      - run: uv sync --only-group wiki
      - run: python3 tools/generate_wiki_boundaries.py
      - run: python3 tools/generate_llms_full.py
      - run: uv run --only-group wiki mkdocs build --strict
