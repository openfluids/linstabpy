name: Pages

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "mkdocs.yml"
      - "tools/generate_llms_full.py"
      - "tools/generate_wiki_boundaries.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "wiki/**"
      - "mkdocs.yml"
      - "tools/generate_llms_full.py"
      - "tools/generate_wiki_boundaries.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Read-only by default. pages/id-token are granted only on the deploy job.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      # --only-group skips the numerical stack. MkDocs does not need it.
      # Do not call configure-pages here: that action fails until Pages is on.
      - run: uv sync --only-group wiki
      - run: python3 tools/generate_wiki_boundaries.py
      - run: python3 tools/generate_llms_full.py
      - run: uv run --only-group wiki mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    # Deploy stays off until PAGES_ENABLED=true.
    # Turn on Pages, then set that repository variable.
    # GitHub Free cannot serve Pages from a private org repo.
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
