version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Re-enabled once [[tool.uv.dependency-metadata]] in pyproject.toml stopped
  # resolution from building petsc4py. Before that, every Python update run
  # died with "Could not find a functional BLAS" and no security PR could ever
  # be opened. Resolution now takes ~0.1s instead of failing after minutes.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dev-tooling:
        patterns:
          - "ruff"
          - "pytest*"
          - "sympy"
