version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dev-tooling:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "hypothesis"

  # This repo ships a Dockerfile; without this the base image never gets
  # security updates, which is the part of the stack least likely to be
  # noticed by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
