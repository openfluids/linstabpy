[build-system]
requires = ["setuptools >= 68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linstab2d"
version = "0.1.0"
description = "Stability and resolvent analysis of compressible viscous flows"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
readme = "README.md"
authors = [
    { name = "Ricardo Frantz" },
    { name = "Gabriel Hamada" },
]
keywords = ["stability", "resolvent", "compressible", "Navier-Stokes", "PETSc", "SLEPc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy >= 1.23",
    "scipy >= 1.10",
    "matplotlib >= 3.7",
    "h5py",
]

[project.optional-dependencies]
petsc = [
    "mpi4py >= 3.1",
    "petsc4py >= 3.18",
    "slepc4py >= 3.18",
]

[dependency-groups]
test = ["pytest", "pytest-cov", "sympy>=1.13"]
dev = [{include-group = "test"}, "h5py"]

[project.urls]
Repository = "https://github.com/ricardofrantz/linstab2d"
Documentation = "https://github.com/ricardofrantz/linstab2d#readme"
Issues = "https://github.com/ricardofrantz/linstab2d/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linstab2d = ["data/baseflows/*.mat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests taking > 30s (deselect with -m 'not slow')"]
