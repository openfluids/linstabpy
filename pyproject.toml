[build-system]
requires = ["setuptools >= 77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linstabpy"
version = "1.0.0rc1"
description = "Stability and resolvent analysis of compressible viscous flows"
requires-python = ">=3.10"
license = "GPL-3.0-only"
readme = "README.md"
authors = [
    { name = "Ricardo Frantz" },
    { name = "Gabriel Hamada" },
]
keywords = ["stability", "resolvent", "compressible", "Navier-Stokes", "PETSc", "SLEPc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy >= 1.23",
    "scipy >= 1.10",
    "matplotlib >= 3.7",
]

[project.optional-dependencies]
hdf5 = [
    "h5py",
]
petsc = [
    "mpi4py >= 3.1",
    "petsc4py >= 3.18",
    "slepc4py >= 3.18",
]

[dependency-groups]
test = ["pytest", "pytest-cov", "sympy>=1.13"]
dev = [{include-group = "test"}]
parity = ["h5py"]

[project.urls]
Repository = "https://github.com/ricardofrantz/linstabpy"
Documentation = "https://github.com/ricardofrantz/linstabpy#readme"
Issues = "https://github.com/ricardofrantz/linstabpy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests taking > 30s (deselect with -m 'not slow')"]
