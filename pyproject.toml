[build-system]
requires = ["setuptools >= 77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linstabpy"
version = "1.0.1"
description = "Stability and resolvent analysis of compressible viscous flows"
requires-python = ">=3.11"
license = "GPL-3.0-only"
readme = "README.md"
authors = [
    { name = "Gabriel Hamada" },
    { name = "William Wolf" },
    { name = "Carlos Junqueira-Junior" },
    { name = "Jean-Christophe Robinet" },
    { name = "Ricardo Frantz" },
]
keywords = ["stability", "resolvent", "compressible", "Navier-Stokes", "PETSc", "SLEPc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy >= 1.23",
    "scipy >= 1.10",
    "matplotlib >= 3.7",
    "pyyaml>=6.0",
]

[project.scripts]
linstabpy = "linstabpy.driver.cli:main"

[project.optional-dependencies]
hdf5 = [
    "h5py",
]
petsc = [
    "mpi4py >= 3.1",
    "petsc4py >= 3.18",
    "slepc4py >= 3.18",
]
# GPU sparse-direct backend through NVIDIA cuDSS. Proprietary NVIDIA runtime
# wheels as an optional dependency (same standing as CUDA under PETSc); needs
# a CUDA 12 runtime and an NVIDIA GPU supported by cuDSS.
cudss = [
    "nvmath-python[cu12] >= 1.0, < 2",
]

[dependency-groups]
test = ["pytest", "pytest-cov", "sympy>=1.13"]
dev = [
    {include-group = "test"},
]
parity = ["h5py"]
wiki = ["mkdocs-material>=9.6"]

[project.urls]
Homepage = "https://linstabpy.vercel.app/"
Documentation = "https://linstabpy.vercel.app/"
Repository = "https://github.com/openfluids/linstabpy"
Changelog = "https://github.com/openfluids/linstabpy/blob/main/CHANGELOG.md"
Issues = "https://github.com/openfluids/linstabpy/issues"

[tool.setuptools.packages.find]
where = ["src"]

# petsc4py and slepc4py publish no wheels -- only sdists whose build compiles
# PETSc/SLEPc from source. Resolving the lock therefore tried to build PETSc
# just to read package metadata, which needs a matched MPI toolchain and a
# BLAS. That fails anywhere those are absent: every Dependabot run died with
# "Could not find a functional BLAS", so security updates for pillow, pygments
# and pytest could never be proposed.
#
# Declaring the metadata here lets uv resolve without building. The edges below
# reproduce exactly what the built sdists reported in the previous lock, so the
# dependency graph is unchanged -- only the way uv learns it. (Note PyPI's
# static requires-dist for petsc4py omits `petsc`; the built metadata includes
# it, and that is what the lock recorded.)
#
# slepc4py additionally pins a matching petsc4py minor per release. That pairing
# is deliberately not reproduced here, because the versions that actually matter
# are the ones built against the system PETSc/SLEPc, not whatever the lock
# records.
[[tool.uv.dependency-metadata]]
name = "petsc4py"
requires-dist = ["numpy", "petsc"]

[[tool.uv.dependency-metadata]]
name = "slepc4py"
requires-dist = ["numpy", "petsc4py"]

[[tool.uv.dependency-metadata]]
name = "petsc"
requires-dist = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: tests taking > 30s (deselect with -m 'not slow')",
  "matlab_parity: compares against MATLAB-derived reference data, which this repository does not ship. Deselected by default; run with LINSTABPY_MATLAB_PARITY=1 pytest -m matlab_parity",
]
# Deselect the MATLAB-parity tests by default. They are not skipped -- they are not
# collected, so they cannot pad the skip count of a default run. Reference data for
# them is deliberately not committed, so on almost every machine those skips could
# never be satisfied, and a suite reporting them as "skipped" overstated its own
# coverage. A user-supplied -m on the command line takes precedence over this.
addopts = "-m 'not matlab_parity'"

[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/test_sponge.py"]
mutate_only_covered_lines = true
timeout_multiplier = 30.0
timeout_constant = 2.0
only_mutate = [
  "src/linstabpy/baseflow/sponge.py",
]
do_not_mutate = [
  "*plotting.py",
  "*__tests.py",
]
do_not_mutate_patterns = [
  'logger\.\w+',
  'logging\.\w+',
  'print\(',
  'plt\.',
  'matplotlib',
]

# ruff: https://docs.astral.sh/ruff/configuration/
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    "docs/tutorial",
    "src/linstabpy/data",
    "examples/song",
    "examples/savarino",
]

[tool.ruff.lint]
# Pragmatic starter set tuned for a scientific-computing codebase.
# Strict on correctness (F* pyflakes), modernization (UP), and isort (I).
# Lenient on style rules that fight common scientific-Python idioms.
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
]
ignore = [
    "E402",   # module-import-not-at-top-of-file — common with cv2/petsc/mpi4py conditional imports
    "E501",   # line-too-long — formatter handles wrapping; long math lines stay readable
    "E702",   # multiple-statements-on-one-line-semicolon — minor, often deliberate for tight loops
    "E731",   # lambda-assignment — common in plotting and quick callbacks
    "E741",   # ambiguous variable names (i, l, o) — common in numerics (l for length, I for current)
    "UP015",  # redundant open() mode — pre-3.10 style still readable
    "UP037",  # quoted annotation — explicit string annotations are sometimes deliberate
]

[tool.ruff.lint.per-file-ignores]
# Tests may import fixtures without using them directly
"tests/**" = ["F401", "F811", "F841"]
# __init__.py files re-export public symbols; ruff treats this as F401 unless
# explicit `as X` aliasing is used, which is noise for science libraries.
"**/__init__.py" = ["F401"]
# Example drivers use lazy imports for heavy modules (Mesh, PETSc) inside
# function bodies; type annotations reference them at module level.
"examples/**" = ["F821", "F841"]
# Validation harness uses similar lazy-import + ad-hoc helper patterns.
"examples/linstab2d/**" = ["F821", "F841"]
# sbp_generator.py is a frozen validated-math file (Invariant A,
# test_deny_list_math_frozen.py). Its pre-existing unused `a_i2` (F841) in the
# order>8 branch must not be edited -- the freeze forbids touching the body -- so
# ignore F841 here rather than changing the frozen hash.
"src/linstabpy/mesh/sbp_generator.py" = ["F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# Strict agent gate for new Python files (ruff all-rules, basedpyright, STE).
[tool.py-strict]
scope = "new"

[tool.uv]
exclude-newer = "7 days"
# Security fixes younger than 7 days (Pillow 13.0.0, certifi 2026.10.19). Remove after 2026-10-26.
exclude-newer-package = { pillow = false, certifi = false }
