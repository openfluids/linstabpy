[build-system]
requires = ["setuptools >= 77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linstabpy"
version = "1.0.0rc9"
description = "Stability and resolvent analysis of compressible viscous flows"
requires-python = ">=3.10"
license = "GPL-3.0-only"
readme = "README.md"
authors = [
    { name = "Ricardo Frantz" },
    { name = "Gabriel Hamada" },
]
keywords = ["stability", "resolvent", "compressible", "Navier-Stokes", "PETSc", "SLEPc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy >= 1.23",
    "scipy >= 1.10",
    "matplotlib >= 3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
hdf5 = [
    "h5py",
]
petsc = [
    "mpi4py >= 3.1",
    "petsc4py >= 3.18",
    "slepc4py >= 3.18",
]
# GPU sparse-direct backend through NVIDIA cuDSS. Proprietary NVIDIA runtime
# wheels as an optional dependency (same standing as CUDA under PETSc); needs
# a CUDA 12 runtime and an NVIDIA GPU supported by cuDSS.
cudss = [
    "nvmath-python[cu12] >= 1.0, < 2",
]

[dependency-groups]
test = ["pytest", "pytest-cov", "sympy>=1.13"]
dev = [{include-group = "test"}]
parity = ["h5py"]

[project.urls]
Repository = "https://github.com/openfluids/linstabpy"
Documentation = "https://github.com/openfluids/linstabpy#readme"
Issues = "https://github.com/openfluids/linstabpy/issues"

[tool.setuptools.packages.find]
where = ["src"]

# petsc4py and slepc4py publish no wheels -- only sdists whose build compiles
# PETSc/SLEPc from source. Resolving the lock therefore tried to build PETSc
# just to read package metadata, which needs a matched MPI toolchain and a
# BLAS. That fails anywhere those are absent: every Dependabot run died with
# "Could not find a functional BLAS", so security updates for pillow, pygments
# and pytest could never be proposed.
#
# Declaring the metadata here lets uv resolve without building. The edges below
# reproduce exactly what the built sdists reported in the previous lock, so the
# dependency graph is unchanged -- only the way uv learns it. (Note PyPI's
# static requires-dist for petsc4py omits `petsc`; the built metadata includes
# it, and that is what the lock recorded.)
#
# slepc4py additionally pins a matching petsc4py minor per release. That pairing
# is deliberately not reproduced here, because the versions that actually matter
# are the ones built against the system PETSc/SLEPc, not whatever the lock
# records.
[[tool.uv.dependency-metadata]]
name = "petsc4py"
requires-dist = ["numpy", "petsc"]

[[tool.uv.dependency-metadata]]
name = "slepc4py"
requires-dist = ["numpy", "petsc4py"]

[[tool.uv.dependency-metadata]]
name = "petsc"
requires-dist = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: tests taking > 30s (deselect with -m 'not slow')",
  "matlab_parity: compares against MATLAB-derived reference data, which this repository does not ship. Deselected by default; run with LINSTABPY_MATLAB_PARITY=1 pytest -m matlab_parity",
]
# Deselect the MATLAB-parity tests by default. They are not skipped -- they are not
# collected, so they cannot pad the skip count of a default run. Reference data for
# them is deliberately not committed, so on almost every machine those skips could
# never be satisfied, and a suite reporting them as "skipped" overstated its own
# coverage. A user-supplied -m on the command line takes precedence over this.
addopts = "-m 'not matlab_parity'"

[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/test_viscosity.py"]
mutate_only_covered_lines = true
timeout_multiplier = 30.0
timeout_constant = 2.0
only_mutate = [
  "src/linstabpy/baseflow/viscosity.py",
]
do_not_mutate = [
  "*plotting.py",
  "*__tests.py",
]
do_not_mutate_patterns = [
  'logger\.\w+',
  'logging\.\w+',
  'print\(',
  'plt\.',
  'matplotlib',
]

# Strict agent gate for new Python files (ruff all-rules, basedpyright, STE).
[tool.py-strict]
scope = "new"
