# Packaged validation cases and the artifacts each module writes.
# This file is a registry, not a solver case. It does not go through driver.run.

cases:
  - name: curvilinear_validation
    module: examples.martini.example_0_curvilinear_validation
    artifacts:
      - examples/martini/example_0_curvilinear_validation.npz

  - name: blasius_resolvent
    module: examples.martini.example_1_blasius
    artifacts:
      - examples/martini/example_1_blasius.npz

  - name: blasius_resolvent_high_penalty
    module: examples.martini.example_1_blasius
    env:
      LINSTABPY_BLASIUS_BC_PENALTY: "1e6"   # stronger Dirichlet penalty
      LINSTABPY_EIGEN_ST_SOLVER: mumps      # shift-invert backend
    artifacts:
      - examples/martini/example_1_blasius.npz

  - name: song_stability
    module: examples.song.song
    artifacts:
      - examples/song/song.npz

# Chu-weighted orthogonality check on the Song EVP modes.
orthogonality_check:
  artifact: examples/song/song.npz   # runtime archive
  mode_key: direct_modes             # mode array in that archive
  weights_key: W_diag                # Chu weight diagonal
  tolerance: 1.0e-12                 # max allowed inner product
