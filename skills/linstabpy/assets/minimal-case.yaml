# Minimal linstabpy case template (nested blocks, as the linstabpy command reads them).
#
# This file passes validate_config; it is a starting point, not a complete
# research case (a real run also needs baseflow inputs and BC/solver detail
# — copy the commented structure of examples/linstab2d/example_1_blasius.yaml).
#
# Validate before running:
#   .venv/bin/python -c "from linstabpy.config.schema import validate_config;
#   from linstabpy.utils.yaml_io import load_config;
#   validate_config(load_config('minimal-case.yaml'), source='minimal-case.yaml')"
#
# Then run through the driver (config travels by env var, never by flag):
#   export LINSTABPY_CASE_CONFIG=minimal-case.yaml LINSTABPY_CASE_OUTPUT_NPZ=minimal-case.npz
#   mpiexec -n 4 linstabpy
#
# Notes: SBP fd_order is 2, 4, 6, or 8 only; complex values use
# [real, imag] lists; every top-level key below is in
# TOP_LEVEL_ALLOWED (see ../references/generated/yaml-keys.md). The command refuses
# flat Re, Ma, fd_order, beta, ... because it reads only the nested keys.

schema_version: "1"
model: martini
nx: 60
ny: 40
physics:
  Re: 6.0e5
  Ma: 0.3
  Pr: 0.72
  kappa: 1.4
  T_0: 1.0
numerics:
  fd_order: 4
  beta: 0.0
analysis:
  run_stability: true
  run_resolvent: false
  n_modes_stability: 4
  n_modes_resolvent: 0
  omega_target: [0.5, 0.0]
