<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Ground tile matching #0D1116 -->
  <rect width="32" height="32" rx="7" fill="#0D1116" stroke="#1c2330" stroke-width="1"/>
  
  <!-- Neutral stability axis (Im(omega) = 0) -->
  <line x1="4" y1="16" x2="28" y2="16" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.35"/>
  
  <!-- Continuous stable branches (Im(omega) < 0) in electric cyan & teal -->
  <path d="M7 16.5C9 18.5 11 22 13 26" stroke="#06b6d4" stroke-width="1" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M12 16.5C14 19 16 23 18 27" stroke="#14b8a6" stroke-width="1" stroke-linecap="round" stroke-opacity="0.85"/>
  <path d="M17 16.5C19 19.5 21 23.5 23 27" stroke="#22d3ee" stroke-width="1" stroke-linecap="round" stroke-opacity="0.75"/>
  <path d="M22 16.5C23.5 19 25 22 26.5 25" stroke="#06b6d4" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.7"/>
  
  <!-- Luminous eigenvalues on stable branch -->
  <circle cx="13" cy="26" r="1.1" fill="#22d3ee"/>
  <circle cx="18" cy="27" r="1.1" fill="#14b8a6"/>
  <circle cx="23" cy="27" r="1.1" fill="#22d3ee"/>

  <!-- Unstable discrete eigenvalues (Im(omega) > 0) in hot coral with glow -->
  <circle cx="22" cy="8" r="2.8" fill="#fb7185" fill-opacity="0.25"/>
  <circle cx="22" cy="8" r="1.4" fill="#f43f5e"/>
  
  <circle cx="16" cy="11" r="2.2" fill="#fb7185" fill-opacity="0.2"/>
  <circle cx="16" cy="11" r="1.1" fill="#f43f5e"/>
</svg>
