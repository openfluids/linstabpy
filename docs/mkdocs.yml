site_name: LinStabPy
site_url: https://linstabpy.vercel.app/
site_description: Sparse linear stability and resolvent analysis of compressible viscous flows
repo_url: https://github.com/openfluids/linstabpy
repo_name: openfluids/linstabpy
docs_dir: pages
site_dir: site
use_directory_urls: true
strict: true

validation:
  omitted_files: ignore
  absolute_links: warn
  unrecognized_links: warn

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo.svg
  palette:
    # Default: Slate (Dark Mode)
    - scheme: slate
      primary: slate
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light Mode
    - scheme: default
      primary: slate
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search
  - privacy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
  - assets/katex/katex.min.css

extra_javascript:
  - javascripts/mermaid-zoom.js
  - javascripts/font-size.js
  - javascripts/sidebar-toggle.js
  - assets/katex/katex.min.js
  - assets/katex/contrib/auto-render.min.js
  - javascripts/katex.js

nav:
  - Home: index.md
  - Getting started: getting-started/index.md
  - Use with Claude Code: claude-code.md
  - Installation: installation.md
  - Troubleshooting: troubleshooting.md
  - Architecture: architecture.md
  - Modules:
      - modules/index.md
      - Runtime driver: modules/driver.md
      - LNSE assembly: modules/operators.md
      - BC recipes: modules/boundary-conditions.md
      - Structured mesh: modules/mesh.md
      - Base flow: modules/baseflow.md
      - Configuration: modules/config.md
      - Stability analysis: modules/stability.md
      - Resolvent analysis: modules/resolvent.md
      - Resolvent sign convention: resolvent-sign-convention.md
      - Solvers and routing: modules/solvers.md
      - Linear algebra: modules/linalg.md
      - Shared utilities: modules/shared-utilities.md
  - Boundaries: boundaries.md
  - Solver glossary: solver-glossary.md
  - Core concepts: core-concepts.md
  - FAQ: faq.md
  - References: references.md
  - Development:
      - Development workflow: development/development.md
      - Compute backends: development/compute-backends.md
      - Runtime NPZ contract: development/runtime-npz-contract.md
