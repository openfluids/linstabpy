# Song 31.6 deg EVP, the published stride-1 rung. Run with the shared driver
# so operator dissipation is applied. omega_i = -5.010641e-2 on this mesh.
paths:
  case_dir: examples/song/song_316deg.npz
physics:
  Re: 100000.0
  Ma: 2.15
  Pr: 0.72
  kappa: 1.4
  T_0: 153.33
  zero_spanwise: false
  zero_mu_t_derivs: false
  use_matlab_sponge_aux: false
  sponge:
    enabled: false
numerics:
  stride_ksi: 1
  stride_eta: 1
  fd_order: 4
  beta: 19.04
  alpha_filter: 0.0
  operator_dissipation:
    enabled: true
    epsilon: 0.02
    apply_to_stability: true
bc:
  penalty: 100000000.0
  recipe:
    - {type: dirichlet, borders: lt, variables: ruvwT}
    - {type: dirichlet, borders: b, variables: ruvw}
    - {type: neumann, borders: b, variables: T}
    - {type: neumann, borders: r, variables: ruvwT}
analysis:
  run_stability: true
  run_resolvent: false
  n_modes_stability: 40
  omega_target:
    real: 0.0
    imag: 0.0
solver:
  petsc_matrix_mode: distributed
  eigen:
    st_solver: mumps
    eps_tol: 1.0e-6
    ncv: 160
    conv_test: rel
  linsolve:
    type: mumps
