# Song 31.6 deg EVP, the published stride-1 rung. Run with the shared driver
# so operator dissipation is applied. omega_i = -5.010641e-2 on this mesh.
paths:
  case_dir: examples/song/song_316deg.npz  # packed x,y,rho,u,v,w,T,sponge
physics:
  Re: 100000.0           # Reynolds number based on X_sh
  Ma: 2.15               # freestream Mach
  Pr: 0.72               # Prandtl number
  kappa: 1.4             # ratio of specific heats
  T_0: 153.33            # reference temperature [K]
  zero_spanwise: false   # keep the packed W field
  zero_mu_t_derivs: false
  use_matlab_sponge_aux: false
  sponge:
    enabled: false       # use the packed sponge only
numerics:
  stride_ksi: 1          # 1 = as packed
  stride_eta: 1
  fd_order: 4            # SBP interior order
  beta: 19.04            # spanwise wavenumber * X_sh
  alpha_filter: 0.0      # implicit filter; 0 keeps the filter real
  operator_dissipation:
    enabled: true
    epsilon: 0.02        # sawtooth damping; re-tune if the mesh leaks
    apply_to_stability: true
bc:
  penalty: 100000000.0   # Dirichlet/Neumann penalty
  recipe:
    - {type: dirichlet, borders: lt, variables: ruvwT}  # inlet + freestream
    - {type: dirichlet, borders: b, variables: ruvw}    # no-slip wall
    - {type: neumann, borders: b, variables: T}         # adiabatic wall
    - {type: neumann, borders: r, variables: ruvwT}     # outflow
analysis:
  run_stability: true    # run the temporal EVP
  run_resolvent: false   # skip resolvent
  n_modes_stability: 40  # eigenvalues to report
  omega_target:
    real: 0.0            # shift-invert target
    imag: 0.0
solver:
  petsc_matrix_mode: distributed
  eigen:
    st_solver: mumps     # shift-invert backend
    eps_tol: 1.0e-6      # SLEPc relative tolerance
    ncv: 160             # Arnoldi subspace size
    conv_test: rel
  linsolve:
    type: mumps          # direct LU
