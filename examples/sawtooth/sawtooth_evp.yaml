# Lui 2022 suction-side SWBLI on the packed stride-2 mesh (300 x 340).
# Physics from the archived Case 2 parity config. The field is already coarse.
paths:
  case_dir: examples/sawtooth/sawtooth.npz  # packed x,y,rho,u,v,w,T,sponge
physics:
  Re: 395000.0       # Reynolds number on axial chord
  Ma: 2.0            # freestream Mach
  Pr: 0.747          # Prandtl
  kappa: 1.31        # ratio of specific heats
  T_0: 1540.0        # reference temperature [K]
  zero_spanwise: false
  use_matlab_sponge_aux: false
  zero_mu_t_derivs: true   # freeze d(mu)/dT and d2(mu)/dT2
numerics:
  stride_ksi: 1      # field is already stride-2; do not coarsen again
  stride_eta: 1
  fd_order: 6        # SBP interior order
  beta: 0.0          # spanwise wavenumber (0 = 2-D)
  alpha_filter: 0.0  # implicit filter strength; 0 keeps the filter real
  # Floquet shift: matlab_parity (default) or continuum
  floquet_shift: matlab_parity
  operator_dissipation:
    enabled: true
    epsilon: 0.10    # sawtooth damping; re-tune if the mesh leaks
    apply_to_stability: true
    apply_to_resolvent: false
bc:
  penalty: 1000000.0
  recipe:
    - {type: dirichlet, borders: lt, variables: ruvwT}  # inlet + freestream
    - {type: dirichlet, borders: b, variables: ruvw}    # no-slip wall
    - {type: neumann, borders: b, variables: T, exclude_corners: true}  # adiabatic wall
    - {type: neumann, borders: r, variables: ruvwT, exclude_corners: true}  # outflow
analysis:
  ratio_uinf: 1.0
  ratio_l: 0.1
  St: 0.1            # unused while omega_target is set
  n_modes_stability: 20
  n_modes_resolvent: 1
  run_stability: true
  run_resolvent: false
  use_raw_eigs: false
  omega_target:
    real: 0.561107
    imag: -1.112186
solver:
  petsc_matrix_mode: distributed
  # MUMPS null-pivot detection off: with it on, some runs stall on the mode
  # near omega = -0.715i (Krylov-Schur restarts at a constant error).
  mumps_icntl_24: null
  eigen:
    st_solver: mumps
    eps_tol: 1.0e-4    # the shift-invert residual floors at 1e-5..8e-5 on this case
    ncv: 80
    conv_test: rel
    true_residual: true
    residual_error_type: relative
    extract_all_converged: true
  linsolve:
    type: mumps
