# MATLAB: run_ex3_paper_spatial.m (temporal block + spatial)
# tag: paper_spatial_Lxpi_nP2
nx: 100
ny: 200
fd_order: 4
alpha_filter: 0.0
Lx: 3.141592653589793
Ly: 5.0
x_periodicity: true
y_stretch_yi: 2.0
sponge:
  amplitude: 0.1
  ys_offset: 1.0
  ys_trans: 0.5
temporal_targets: [[0.5498, 1.1]]
temporal_quotas: [50]
n_modes: 50
ncv: 1500
alpha_temp: 0.6283
n_periods: 2
dedupe_tol: 1.0e-4
spatial_omega_imag_shift: 0.0
run_temporal: true
run_spatial: true
model: "2D"
bc:
  recipe:
    - {type: dirichlet, borders: tb, variables: uvwT}
assembly_backend: scipy
solver:
  petsc_matrix_mode: auto
  linsolve:
    type: mumps
