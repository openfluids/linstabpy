# Example 5: Paraboloid resolvent analysis
# Curvilinear transformation to a parabolic physical grid,
# axisymmetric model, m=5 azimuthal Fourier mode.
#
# Mesh parity: see example_5_D2y_asymm_fix.md — full Dy/D2y metric terms in
# Mesh.deform _deform_full_2d (fixes D2y_asymm vs LinStab2D on this map).

nx: 100                    # computational nodes in xi
ny: 100                    # computational nodes in eta
fd_order: 4                # SBP interior order
alpha_filter: 0.0          # implicit filter; 0 keeps the filter real
xrange: [-1.0, 0.0]        # computational x interval
yrange: [0.0, 1.0]         # computational y interval
y_symmetry: true           # axisymmetric half-plane
x_periodicity: false       # open streamwise ends

Lx: 2.25                   # physical streamwise length
Ly: 1.5                    # physical wall-normal height

# Sponge is defined on pre-conformal coordinates.
sponge:
  amplitude: 5.0           # sponge strength
  xs_offset: 0.1           # sponge starts this far from the outlet
  xs_trans_fraction: 0.1   # xs_trans = Lx / 10
  ys_offset: 0.1           # sponge starts this far from the top
  ys_trans: 0.1            # wall-normal ramp width

omega: 0.0                 # angular frequency
omega_shift_fallback: 1.0e-4       # small imag shift when omega=0 is singular
use_omega_shift_fallback: true     # apply that shift
n_modes: 3                 # leading resolvent triplets
m: 5                       # azimuthal Fourier mode
model: axy                 # axisymmetric LNSE

# scipy is the cross-machine baseline. petsc is an explicit opt-in.
# Do not use auto for installation baselines.
assembly_backend: scipy

forcing_zero_vars: ["T", "rho"]  # variables zeroed in B/C

bc:
  recipe:
    - {type: dirichlet, borders: ltr, variables: uvwT}  # inlet, top, outlet

solver:
  petsc_matrix_mode: auto  # auto / local / distributed
  linsolve:
    type: mumps            # direct LU
