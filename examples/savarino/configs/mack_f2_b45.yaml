# Savarino point (conservative-momentum forcing space) beta=45.0 f=2 -- the
# medium-frequency first-Mack point used by verify_norm_convention.py and
# compare_modes.py.
paths:
  # Written by savarino_to_npy.py, relative to examples/savarino/ (the drivers and
  # generators resolve it there; run_compare_points.py runs from that directory).
  case_dir: output/baseflow
physics:
  Re: 100000.0           # Reynolds number based on X_sh
  Ma: 2.15               # freestream Mach
  Pr: 0.72               # Prandtl number
  kappa: 1.4             # ratio of specific heats
  T_0: 156.92            # reference temperature [K]
  zero_spanwise: false
  zero_mu_t_derivs: false
  use_matlab_sponge_aux: false
  sponge:
    enabled: false       # use the packed sponge only
numerics:
  stride_ksi: 1          # 1 = as packed
  stride_eta: 1
  fd_order: 4            # SBP interior order
  beta: 45.0             # spanwise wavenumber * X_sh
  alpha_filter: 0.0      # implicit filter; 0 keeps the filter real
  operator_dissipation:
    enabled: false       # rectilinear mesh; leak ~ 1e-17
    epsilon: 0.0
    apply_to_stability: true
    apply_to_resolvent: true
bc:
  penalty: 100000000.0
  recipe:
    - {type: dirichlet, borders: lt, variables: ruvwT}  # inlet + freestream
    - {type: dirichlet, borders: b, variables: ruvw}    # no-slip wall
    - {type: neumann, borders: b, variables: T}         # adiabatic wall
    - {type: neumann, borders: r, variables: ruvwT}     # outflow
analysis:
  ratio_uinf: 1.0
  ratio_l: 0.1
  St: 0.1                # unused while omega_target is set
  run_stability: false
  run_resolvent: true
  use_raw_eigs: false
  n_modes_stability: 20
  n_modes_resolvent: 1
  skip_band_marking: true
  omega_target:
    real: 12.566370614359172   # 2 pi f with f = 2
    imag: 0.0
solver:
  petsc_matrix_mode: distributed
  factor_backend: mumps
  eigen:
    st_solver: mumps
    eps_tol: 1.0e-6
    ncv: 160
    conv_test: rel
    true_residual: false
  linsolve:
    type: mumps
  resolvent:
    type: mumps
    eigen:
      forcing_norm: l2
      # Krylov-Schur on H^H H with nev=1: ncv 5 needs 10 MUMPS solves per point,
      # the default 20 needs 40; sigma_1 agrees to 1e-14 (job 1859, beta=40, f=1.0/1.4).
      ncv: 5
  input_region:
    space: conservative_momentum
    vars: [u, v, w]
    x: [0.20291667, 1.9470833]
    y: [0.0, 0.29627645]
  mask_bc_forcing: true
