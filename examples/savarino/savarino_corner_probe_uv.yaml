# Low-frequency (beta=0) probe restricted to the (u, v) forcing components,
# used to bracket the input-region sensitivity at the domain corner.
paths:
  # Point this at the directory written by savarino_to_npy.py.
  case_dir: data/converted
physics:
  Re: 100000.0           # Reynolds number based on X_sh
  Ma: 2.15               # freestream Mach
  Pr: 0.72               # Prandtl number
  kappa: 1.4             # ratio of specific heats
  T_0: 156.92            # reference temperature [K]
  zero_spanwise: false
  zero_mu_t_derivs: false
  use_matlab_sponge_aux: false
  sponge:
    enabled: false       # use the packed sponge only
numerics:
  stride_ksi: 1          # 1 = as packed
  stride_eta: 1
  fd_order: 4            # SBP interior order
  beta: 0.0              # spanwise wavenumber (0 = 2-D)
  alpha_filter: 0.0      # implicit filter; 0 keeps the filter real
  operator_dissipation:
    enabled: false       # rectilinear mesh; leak ~ 1e-17
    epsilon: 0.0
    apply_to_stability: true
    apply_to_resolvent: true
bc:
  penalty: 100000000.0
  recipe:
    - {type: dirichlet, borders: lt, variables: ruvwT}  # inlet + freestream
    - {type: dirichlet, borders: b, variables: ruvw}    # no-slip wall
    - {type: neumann, borders: b, variables: T}         # adiabatic wall
    - {type: neumann, borders: r, variables: ruvwT}     # outflow
analysis:
  ratio_uinf: 1.0
  ratio_l: 0.1
  St: 0.1                # unused while omega_target is set
  run_stability: false
  run_resolvent: true
  use_raw_eigs: false
  n_modes_stability: 20
  n_modes_resolvent: 1
  skip_band_marking: true
  omega_target:
    real: 0.0006283185307179586
    imag: 0.0
solver:
  petsc_matrix_mode: distributed
  factor_backend: mumps
  eigen:
    st_solver: mumps
    eps_tol: 1.0e-6
    ncv: 160
    conv_test: rel
    true_residual: false
  linsolve:
    type: mumps
  resolvent:
    type: mumps
    eigen:
      forcing_norm: l2
  input_region:
    space: conservative_momentum
    vars: [u, v]
    x: [0.20291667, 1.7954167]
    y: [0.0, 0.29627645]
  mask_bc_forcing: true
