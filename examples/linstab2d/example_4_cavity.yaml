# Example 4: Cavity global/adjoint stability analysis
# Masked cavity geometry, deformed mesh, direct + adjoint temporal EVP.

Pr: 0.7                    # MATLAB example_4_Cavity.m parity (Step_BF.mat stores 0.71)
zero_dmudT: true            # MATLAB readbaseflow uses dMUdT=0 in the operator

nx: 241                    # streamwise nodes
ny: 101                    # wall-normal nodes
fd_order: 4                # SBP interior order
alpha_filter: 0.0          # implicit filter; 0 keeps the filter real
y_symmetry: true           # mirror the y mapping
x_periodicity: false       # open streamwise ends

x_cavity_start: 0.34029    # cavity leading-edge x
L_cavity: 1.9995           # cavity length
mask_x_left: 0.34          # mask threshold for the left wall
mask_x_right: 2.34         # mask threshold for the right wall

deform:
  y_cubic_a: 0.5           # cubic-blend coefficient for y deformation
  stretch_n: 3             # exponent for y/x stretching
  y_threshold: 0.0         # y > threshold is stretched
  y_amplitude: 2.0         # stretch amplitude in y
  x_threshold: 2.8         # x > threshold is stretched
  x_amplitude: 1.0         # stretch amplitude in x

sponge:
  amplitude: 5.0           # sponge strength
  xs_trans: 0.5            # streamwise ramp width
  xs_offset: 0.5           # sponge starts this far from the outlet
  ys_trans: 0.5            # wall-normal ramp width
  ys_offset: 1.0           # sponge starts this far from the top

omega_target: [1.5, 1.0]   # complex shift 1.5 + 1.0j
n_modes: 50                # reported eigenvalues
ncv: 300                   # Arnoldi subspace size
beta: 0.0                  # spanwise wavenumber (0 = 2-D)
model: "2D"                # Cartesian 2-D LNSE

bc:
  recipe:
    - {type: dirichlet, borders: lbtrm, variables: uvwT}  # walls + mask

# Cavity keeps SciPy assembly because the adjoint build is SciPy-based.
assembly_backend: scipy
solver:
  petsc_matrix_mode: auto  # auto / local / distributed
  linsolve:
    type: mumps            # direct LU
