# Example 1: Blasius boundary-layer resolvent analysis
# Computes resolvent gains, optimal forcings and responses for
# a compressible Blasius boundary layer.

Re: 6.0e5                  # Reynolds number
Ma: 0.3                    # freestream Mach
Pr: 0.7                    # Prandtl number
kappa: 1.4                 # ratio of specific heats
T_0: 273.15                # reference temperature [K]

nx: 300                    # streamwise nodes
ny: 100                    # wall-normal nodes
fd_order: 4                # SBP interior order
alpha_filter: 0.0          # implicit filter; 0 keeps the filter real

dx: 0.01                   # grid spacing used to derive x_min and x_max
x_min_factor: 5            # x_min = x_min_factor * dx
x_max_base: 1.25           # x_max = x_max_base + dx
y_i: 0.01                  # Hanifi 1996 inner mapping parameter
y_max: 0.05                # physical domain height

sponge:
  amplitude: 5.0           # sponge strength
  xs_trans: 0.02           # streamwise ramp width
  xs_offset: 0.02          # sponge starts this far from the outlet
  ys_trans: 0.01           # wall-normal ramp width
  ys_offset: 0.01          # sponge starts this far from the top

omega: 60.0                # angular frequency (also derived from Re in code)
n_modes: 3                 # leading resolvent triplets
kx: 0.0                    # spanwise wavenumber (0 = 2-D)
model: "2D"                # Cartesian 2-D LNSE

forcing_zero_vars: ["T", "rho", "w"]  # variables zeroed in B/C

bc:
  penalty: 1.0e4           # Dirichlet/Neumann penalty
  recipe:
    - {type: dirichlet, borders: lrbt, variables: uvwT}  # all four walls

# LinStab2D parity only: the 2D coefficient path reads unpopulated dMUdT as zero.
# Physically, keep Sutherland dmudT from sutherland_air() (set false or remove).
zero_dmudT_martini_parity: true

# scipy is the cross-machine baseline. petsc is an explicit opt-in.
# Do not use auto for installation baselines.
assembly_backend: scipy
solver:
  petsc_matrix_mode: auto  # auto / local / distributed
  # LinStab2D resolvent sign L0 - (gamma + i*omega) I, kept for MATLAB reference parity.
  # Default is "physical": (gamma - i*omega) I - L0. See wiki/resolvent-sign-convention.md.
  resolvent_sign_convention: matlab_parity
  linsolve:
    type: mumps            # direct LU
