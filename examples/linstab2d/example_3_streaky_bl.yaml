# Example 3: Streaky boundary-layer temporal and spatial analysis
# Periodic x-domain with Hanifi-like y stretch, temporal eigenvalues,
# and spatial eigenvalues in generalized (alpha) form.

nx: 125                    # streamwise nodes
ny: 250                    # wall-normal nodes
fd_order: 4                # SBP interior order
alpha_filter: 0.0          # implicit filter; 0 keeps the filter real
Lx: 3.141592653589793      # streamwise length (= pi)
Ly: 5.0                    # wall-normal height
x_periodicity: true        # periodic in x

y_stretch_yi: 2.0          # Hanifi wall-normal stretch

sponge:
  amplitude: 0.1           # sponge strength
  ys_offset: 1.0           # sponge starts at Ly - ys_offset
  ys_trans: 0.5            # sponge ramp width

# Each target is [real, imag]. Quotas say how many modes to keep per target.
temporal_targets: [[0.59, 0.02], [0.626, -0.005]]
temporal_quotas: [2, 8]
n_modes: 50                # reported temporal modes
ncv: 150                   # Arnoldi subspace size
alpha_temp: 0.6283         # streamwise wavenumber for the temporal solve
n_periods: 2               # Floquet periods (0 = off)
# Martini / LinStab2D parity: repo default is continuum; Ex.~3 pins matlab_parity.
floquet_shift: matlab_parity
dedupe_tol: 1.0e-4         # drop near-duplicate eigenvalues

spatial_omega_imag_shift: 0.0  # imag shift on the spatial omega

run_temporal: true         # run the temporal EVP
run_spatial: true          # run the spatial EVP
model: "2D"                # Cartesian 2-D LNSE

bc:
  recipe:
    - {type: dirichlet, borders: tb, variables: uvwT}  # top and bottom walls

# scipy keeps the historical assembly path.
# petsc uses direct PETSc assembly for the validated local 2-D path.
assembly_backend: scipy
solver:
  petsc_matrix_mode: auto  # auto / local / distributed
  linsolve:
    type: mumps            # direct LU
