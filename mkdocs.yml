site_name: LinStabPy
site_url: https://openfluids.github.io/linstabpy/
site_description: Sparse linear stability and resolvent analysis of compressible viscous flows
repo_url: https://github.com/openfluids/linstabpy
repo_name: openfluids/linstabpy
docs_dir: wiki
site_dir: site
use_directory_urls: true
strict: true

validation:
  omitted_files: ignore
  absolute_links: warn
  unrecognized_links: warn

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo.svg
  palette:
    # Default: Slate (Dark Mode)
    - scheme: slate
      primary: slate
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light Mode
    - scheme: default
      primary: slate
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search
  - privacy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
  - assets/katex/katex.min.css

extra_javascript:
  - javascripts/mermaid-zoom.js
  - javascripts/font-size.js
  - javascripts/sidebar-toggle.js
  - javascripts/katex.js
  - assets/katex/katex.min.js
  - assets/katex/contrib/auto-render.min.js

nav:
  - Home: index.md
  - Getting started: getting-started/index.md
  - Overview: overview.md
  - Architecture: architecture.md
  - Workflow: workflow.md
  - Module guide:
      - modules/index.md
      - Quick reference:
          - Runtime driver: modules/driver.md
          - LNSE assembly: modules/operators.md
          - BC recipes: modules/boundary-conditions.md
          - Structured mesh: modules/mesh.md
          - Packed fields: modules/baseflow.md
          - YAML and Config: modules/config.md
          - Eigenvalues: modules/stability.md
          - Resolvent: modules/resolvent.md
          - Solvers: modules/solvers.md
          - Sparse factors: modules/linalg.md
      - Package notes:
          - Case pipeline: modules/case-orchestration.md
          - Configuration: modules/configuration-management.md
          - Baseflow: modules/baseflow-management.md
          - Mesh: modules/mesh-discretization.md
          - LNSE operator: modules/lnse-operator-assembly.md
          - Stability: modules/stability-analysis.md
          - Resolvent: modules/resolvent-analysis.md
          - Solver routing: modules/solver-routing.md
          - Linear algebra: modules/linear-algebra.md
          - Utilities: modules/shared-utilities.md
  - Boundaries: boundaries.md
  - Solver glossary: solver-glossary.md
  - Core concepts: core-concepts.md
  - FAQ: faq.md
  - References: references.md
